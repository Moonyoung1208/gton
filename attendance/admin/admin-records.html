    <script>
        let currentData = [];

        async function fetchRecords() {
            const formData = new FormData(document.getElementById('searchForm'));
            const params = new URLSearchParams(formData);
            const res = await fetch(`get_all_records.php?${params.toString()}`);
            const data = await res.json();

            currentData = data.list;
            renderTable(data.list);
            updateStats(data.stats);
        }

        function renderTable(list) {

            const container = document.getElementById('recordList');
            container.innerHTML = '';

            list.forEach(row => {
                const isMissing = !row.check_out_time;
                // 개인별 설정된 퇴근시간이 없으면 기본 18:00 사용
                const defaultOut = row.standard_check_out ? row.standard_check_out.substring(0, 5) : '18:00';

                // 카드 엘리먼트 생성
                const div = document.createElement('div');
                // '憶' 문자를 지우고 정상적인 삼항 연산자로 수정했습니다.
                div.className = `record-item ${isMissing ? 'row-missing' : ''}`;

                div.innerHTML = `
            <div class="record-header">
                <span class="record-name">${row.name}</span>
                <div>
                    ${row.is_edited == 1 ? '<span class="edit-badge">수정됨</span>' : ''}
                    <span class="record-dept">${row.dept_name || '미지정'}</span>
                </div>
            </div>
            
            <div class="record-body">
                <div class="time-box">
                    <span class="time-label">출근 시간</span>
                    <span class="time-value">${row.check_in_time ? row.check_in_time.substring(0, 5) : '-'}</span>
                </div>
                <div class="time-box">
                    <span class="time-label">퇴근 시간</span>
                    <span class="time-value">${row.check_out_time ? row.check_out_time.substring(0, 5) : '<b style="color:#ff5252">누락</b>'}</span>
                </div>
                <div class="time-box">
                    <span class="time-label">날짜</span>
                    <span class="time-value">${row.work_date}</span>
                </div>
            </div>

            <button class="btn btn-primary full" onclick="openEditModal(${row.record_id}, '${defaultOut}', '${row.name}')">
                <i class="fa-solid fa-pen-to-square"></i> 수정하기
            </button>
        `;
                container.appendChild(div);
            });
        }

        // 모달 열기
        function openEditModal(recordId, defaultOut, name) {
            // 1. 현재 화면에 표시된 데이터 중 해당 ID를 가진 객체 찾기
            const row = currentData.find(r => r.record_id == recordId);

            if (row) {
                document.getElementById('edit-id').value = recordId;

                // 2. 출근 시간 설정 (데이터가 있으면 00:00 형태로 자르고, 없으면 09:00 기본값)
                document.getElementById('edit-in-time').value = row.check_in_time ? row.check_in_time.substring(0, 5) : '09:00';

                // 3. 퇴근 시간 설정 (데이터가 있으면 자르고, 없으면 DB의 기준퇴근시간 사용)
                document.getElementById('edit-out-time').value = row.check_out_time ? row.check_out_time.substring(0, 5) : defaultOut;
            }

            document.querySelector('.modal-header').innerText = `${name}님 기록 교정`;
            document.getElementById('editModal').style.display = 'block';
        }

        function updateStats(stats) {
            document.querySelector('#card-total .count').innerText = stats.total;
            document.querySelector('#card-missing .count').innerText = stats.missing;
            document.querySelector('#card-edited .count').innerText = stats.edited;
        }

        function closeModal() { document.getElementById('editModal').style.display = 'none'; }

        async function submitEdit() {
            const id = document.getElementById('edit-id').value;
            const inTime = document.getElementById('edit-in-time').value;
            const outTime = document.getElementById('edit-out-time').value;
            const reason = document.getElementById('edit-reason').value;

            if (!id) {
                Swal.fire('오류', '대상 기록 아이디가 누락되었습니다.', 'error');
                return;
            }

            // URLSearchParams 대신 FormData 사용 권장 (더 직관적임)
            const formData = new URLSearchParams();
            formData.append('id', id);
            formData.append('check_in_time', inTime);
            formData.append('check_out_time', outTime);
            formData.append('edit_reason', reason);

            try {
                const res = await fetch('update_record.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });

                const result = await res.json(); // text() 대신 바로 json() 시도

                if (result.success) {
                    Swal.fire('수정 완료!', `상태: ${result.new_status}, 근무시간: ${result.work_hours}`, 'success')
                        .then(() => {
                            closeModal();
                            fetchRecords();
                        });
                } else {
                    Swal.fire('실패', result.message, 'error');
                }
            } catch (error) {
                console.error(error);
                Swal.fire('오류 발생', '서버 통신 중 에러가 발생했습니다.', 'error');
            }
        }

        function downloadSettlementExcel() {
            let csv = "\ufeff이름,부서,날짜,출근,퇴근,근무시간,수정여부,사유\n";
            currentData.forEach(r => {
                let diffStr = "-";
                if (r.check_in_time && r.check_out_time) {
                    const start = new Date(`2000-01-01 ${r.check_in_time}`);
                    let end = new Date(`2000-01-01 ${r.check_out_time}`);
                    if (end < start) end.setDate(end.getDate() + 1);

                    const diffMs = end - start;
                    const diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
                    const diffMins = Math.floor((diffMs / (1000 * 60)) % 60);

                    diffStr = `${String(diffHrs).padStart(2, '0')}:${String(diffMins).padStart(2, '0')}`;
                }

                csv += `"${r.name}","${r.dept_name}","${r.work_date}","${r.check_in_time}","${r.check_out_time}","${r.work_hours || diffStr}","${r.is_edited == 1 ? 'Y' : 'N'}","${r.edit_reason || ''}"\n`;
            });
        }
        function handleSearch(e) { e.preventDefault(); fetchRecords(); }
        document.addEventListener('DOMContentLoaded', fetchRecords);
    </script>
