    <script>
        let isUsernameChecked = false;
        let isUsernameAvailable = false;

        document.addEventListener('DOMContentLoaded', () => {
            const usernameInput = document.getElementById('username');
            const checkBtn = document.getElementById('checkUsernameBtn');
            const usernameMsg = document.getElementById('usernameMessage');
            const signupForm = document.querySelector('.signup-form');
            const usernameRegex = /^[a-z0-9]{4,12}$/;

            // 1. 아이디 실시간 형식 검사
            usernameInput.addEventListener('input', () => {
                const value = usernameInput.value.trim();
                isUsernameChecked = false;
                isUsernameAvailable = false;

                if (value === "") {
                    usernameMsg.textContent = "4~12자의 영문 소문자와 숫자만 사용 가능합니다.";
                    usernameMsg.style.color = "#666";
                    checkBtn.classList.replace('btn-primary', 'btn-secondary');
                } else if (!usernameRegex.test(value)) {
                    usernameMsg.textContent = "형식에 맞지 않습니다. (소문자/숫자 4~12자)";
                    usernameMsg.style.color = "red";
                    checkBtn.classList.replace('btn-primary', 'btn-secondary');
                    checkBtn.disabled = true;
                } else {
                    usernameMsg.textContent = "올바른 형식입니다. 중복 확인을 눌러주세요.";
                    usernameMsg.style.color = "blue";
                    checkBtn.classList.replace('btn-secondary', 'btn-primary');
                    checkBtn.disabled = false;
                }
            });

            // 2. 중복 확인 버튼 (SweetAlert 적용)
            checkBtn.addEventListener('click', () => {
                const username = usernameInput.value.trim();
                fetch('check_username.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `username=${encodeURIComponent(username)}`
                })
                    .then(res => res.json())
                    .then(data => {
                        isUsernameChecked = true;
                        isUsernameAvailable = data.success;

                        if (data.success) {
                            Swal.fire({
                                title: '성공',
                                text: data.message,
                                icon: 'success',
                                confirmButtonColor: '#3457D5' // 확인 버튼 색상
                            });
                            usernameMsg.textContent = data.message;
                            usernameMsg.style.color = 'green';
                        } else {
                            Swal.fire({
                                title: '실패',
                                text: data.message,
                                icon: 'error',
                                confirmButtonColor: '#ef4444' // 에러 시 붉은색 계열
                            });
                            usernameMsg.textContent = data.message;
                            usernameMsg.style.color = 'red';
                        }
                    });
            });

            // 3. 가입하기 폼 제출 (AJAX)
            signupForm.addEventListener('submit', (e) => {
                e.preventDefault();

                // 비밀번호 일치 검사
                const pw = signupForm.querySelector('input[name="password"]').value;
                const pwConfirm = signupForm.querySelector('input[name="password_confirm"]').value;

                if (pw !== pwConfirm) {
                    Swal.fire({
                        title: '비밀번호 오류',
                        text: '비밀번호가 서로 일치하지 않습니다.',
                        icon: 'warning',
                        confirmButtonColor: '#f59e0b' // 경고 시 주황색 계열
                    });
                    return;
                }

                if (!isUsernameChecked || !isUsernameAvailable) {
                    Swal.fire({
                        title: '아이디 중복 확인',
                        text: '아이디 중복 확인이 필요합니다.',
                        icon: 'warning',
                        confirmButtonColor: '#f59e0b'
                    });
                    return;
                }

                const formData = new FormData(signupForm);
                fetch('signup_process.php', {
                    method: 'POST',
                    body: formData
                })
                    .then(res => res.json())
                    .then(data => {
                        if (data.success) {
                            Swal.fire({
                                icon: 'success',
                                title: '가입 성공!',
                                text: data.message,
                                confirmButtonText: '로그인하기',
                                confirmButtonColor: '#3457D5'
                            }).then(() => {
                                location.href = 'index.html';
                            });
                        } else {
                            Swal.fire('가입 실패', data.message, 'error');
                        }
                    })
                    .catch(err => {
                        Swal.fire('오류', '서버 통신 중 문제가 발생했습니다.', 'error');
                    });
            });
        });
    </script>
