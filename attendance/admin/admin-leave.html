                FROM leave_requests l
                JOIN users u ON l.user_id = u.user_id
                JOIN departments d ON u.dept_id = d.id
                WHERE l.status = 'pending'
                ORDER BY l.created_at DESC";
$pending_results = $conn->query($sql_pending);
