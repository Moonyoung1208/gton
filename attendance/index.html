<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>로그인 - 근태ON</title>

    <!-- open graph -->
    <meta property="og:title" content="근태 ON">
    <meta property="og:url" content="https://gton.dothome.co.kr/attendance/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://gton.dothome.co.kr/attendance/assets/og-image.png">
    <meta property="og:title" content="근태 ON">
    <meta property="og:description" content="스마트한 근태관리 시스템, 근태 ON">

    <!-- css -->
    <link rel="stylesheet" href="css/font.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- SweetAlert2 Library -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="57x57" href="/attendance/assets/favi/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/attendance/assets/favi/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/attendance/assets/favi/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/attendance/assets/favi/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/attendance/assets/favi/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/attendance/assets/favi/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/attendance/assets/favi/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/attendance/assets/favi/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/attendance/assets/favi/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/attendance/assets/favi/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/attendance/assets/favi/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/attendance/assets/favi/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/attendance/assets/favi/favicon-16x16.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo font-godo">
                <h1>근태ON</h1>
                <p>스마트한 근태관리 시스템</p>
            </div>

            <form id="loginForm" class="login-form" method="POST" autocomplete='off'>
                <div class="form-group">
                    <label class="form-label" for="username">아이디</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="아이디를 입력해주세요"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">비밀번호</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="비밀번호를 입력해주세요"
                        required>
                </div>

                <div class="form-options">
                    <div class="remember">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <label for="rememberMe">아이디 저장</label>
                    </div>
                    <div class="find">
                        <a href="find_password.html">비밀번호 찾기</a>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary btn-block">로그인</button>
            </form>

            <div class="login-footer">
                <p>계정이 없으신가요? <a href="signup.html">회원가입</a></p>
            </div>
        </div>
    </div>

    <script>
        // 페이지 로드 시 실행: 저장된 아이디가 있다면 필드에 채워넣기
        window.addEventListener('load', function () {
            const savedId = localStorage.getItem('rememberedUsername');
            if (savedId) {
                document.getElementById('username').value = savedId;
                document.getElementById('rememberMe').checked = true;
            }
        });

        document.querySelector('#loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const username = document.getElementById('username').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            submitBtn.disabled = true;
            submitBtn.innerText = "로그인 중...";

            const formData = new FormData(this);

            fetch('login_process.php', {
                method: 'POST',
                body: formData
            })
                .then(response => {
                    if (!response.ok) throw new Error('네트워크 응답에 문제가 있습니다.');
                    return response.json();
                })
                .then(data => {
                    if (data.success) {

                        // 로그인 유지
                        if (rememberMe) {
                            localStorage.setItem('rememberedUsername', username);
                        } else {
                            localStorage.removeItem('rememberedUsername');
                        }

                        Swal.fire({
                            icon: 'success',
                            title: '환영합니다!',
                            text: data.message,
                            timer: 1500,
                            showConfirmButton: false
                        }).then(() => {
                            location.href = 'dashboard.html';
                        });
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: '로그인 실패',
                            text: data.message,
                            confirmButtonColor: '#3457D5'
                        });
                        submitBtn.disabled = false;
                        submitBtn.innerText = "로그인";
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    Swal.fire('오류', '서버 통신 중 문제가 발생했습니다.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerText = "로그인";
                });
        });
    </script>
</body>

</html>
