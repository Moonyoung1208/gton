        <div id="loadMoreSection" style="margin-top: 20px; text-align: center;">
            <button id="btnLoadMore" class="btn btn-outline" style="width: 100%;">
                더보기 <i class="fa-solid fa-chevron-down"></i>
            </button>
        </div>

    <script>
        let currentPage = 1;
        let currentSearch = '';
        const container = document.getElementById('employeeContainer');
        const loadMoreBtn = document.getElementById('btnLoadMore');
        const searchInput = document.getElementById('searchInput');
        const btnSearch = document.getElementById('btnSearch');

        function fetchEmployees(page, search = '') {
            const url = `get_employees.php?page=${page}&search=${encodeURIComponent(search)}`;

            fetch(url)
                .then(res => res.text()) // 에러 확인을 위해 text로 먼저 받음
                .then(text => {
                    try {
                        const data = JSON.parse(text);
                        if (page === 1) container.innerHTML = ''; // 새 검색 시 초기화

                        if (!data || data.length === 0) {
                            if (page === 1) container.innerHTML = '<div class="empty-state">직원이 없습니다.</div>';
                            document.getElementById('loadMoreSection').style.display = 'none';
                            return;
                        }

                        data.forEach(emp => {
                            const statusBadge = emp.status === 'active'
                                ? '<span class="badge badge-success">재직</span>'
                                : '<span class="badge badge-danger">퇴사</span>';

                            const card = `
                            <div class="employee-card" onclick="viewDetail(${emp.user_id})">
                                <div class="emp-info-group">
                                    <div class="emp-row">
                                        <span class="emp-label">성명</span>
                                        <span class="emp-value"><strong>${emp.name}</strong></span>
                                    </div>
                                    <div class="emp-row">
                                        <span class="emp-label">이메일</span>
                                        <span class="emp-value">${emp.email}</span>
                                    </div>
                                    <div class="emp-row">
                                        <span class="emp-label">부서/직급</span>
                                        <span class="emp-value">${emp.dept_name || '미지정'} / ${emp.position}</span>
                                    </div>
                                    <div class="emp-row">
                                        <span class="emp-label">입사일</span>
                                        <span class="emp-value">${emp.join_date}</span>
                                    </div>
                                </div>
                                <div class="emp-status-actions">${statusBadge}</div>
                            </div>`;
                            container.insertAdjacentHTML('beforeend', card);
                        });

                        // 10개 미만이면 더보기 버튼 숨김
                        document.getElementById('loadMoreSection').style.display = data.length < 10 ? 'none' : 'block';
                    } catch (e) {
                        console.error("JSON 파싱 에러. 서버 응답 내용:", text);
                    }
                });
        }

        // 검색 핸들러
        function handleSearch() {
            currentSearch = searchInput.value;
            currentPage = 1;
            fetchEmployees(1, currentSearch);
        }

        btnSearch.addEventListener('click', handleSearch);
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSearch(); });

        loadMoreBtn.addEventListener('click', () => {
            currentPage++;
            fetchEmployees(currentPage, currentSearch);
        });

        document.addEventListener('DOMContentLoaded', () => fetchEmployees(1));

        function viewDetail(userId) {
            location.href = `detail-employee.html?id=${userId}`;
        }
    </script>
</body>

</html>
